[package]
name = "mudrix-mobile"
version = "26.10.19"
description = "Mudrix Mobile: the Mudrix web client in a Tauri shell for iOS and Android."
authors = ["kapsikkum"]
license = "AGPL-3.0-only"
repository = "https://github.com/kapsikkum/mudrix-mobile"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mudrix_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keyboard and scrolling fixes for the iOS web view; Android and desktop never build it.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-webview = { path = "plugins/ios-webview" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
