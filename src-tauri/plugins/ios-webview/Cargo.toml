[package]
name = "tauri-plugin-ios-webview"
version = "0.1.0"
description = "Mudrix Mobile: keeps the iOS WKWebView from scrolling and resizes it above the keyboard."
authors = ["kapsikkum"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"
publish = false
# Required by tauri-plugin's build helper; it must match the package name.
links = "tauri-plugin-ios-webview"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
