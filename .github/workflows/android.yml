name: Android (APK)

# Builds debug-signed APKs for sideloading. Release signing with your own keystore can be added
# later through repository secrets.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-37"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --apk --debug

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          (cd out && for f in *.apk; do mv "$f" "Mudrix-$f"; done; sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Mudrix-apk
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

